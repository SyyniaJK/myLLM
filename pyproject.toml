[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-inference-lab"
version = "0.2.0"
description = "Wireless edge LLM simulation, scheduling baselines, and passive energy accounting"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "torch>=2.5", "gymnasium>=1.0", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
sb3 = ["sb3-contrib>=2.5"]

[project.scripts]
edgeinfer = "edgeinfer.cli:main"

[tool.setuptools.packages.find]
include = ["edgeinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

